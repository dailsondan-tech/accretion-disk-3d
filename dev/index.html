<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Olho do Universo — teste do plugin (quadro)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #2a2a2e; font: 12px sans-serif; color: #aaa; }
    /* simula uma aba do Obsidian: quadro menor que a janela, com barras em volta */
    #barra { position: absolute; left: 0; top: 0; right: 0; height: 36px; padding: 10px 14px; box-sizing: border-box; }
    #lado { position: absolute; left: 0; top: 36px; bottom: 0; width: 70px; background: #232326; }
    #app { position: absolute; left: 70px; top: 36px; right: 0; bottom: 0; }
  </style>
</head>
<body>
  <div id="barra">barra do Obsidian (simulada) — o Olho fica só no quadro abaixo</div>
  <div id="lado"></div>
  <div id="app"><div id="raiz"></div></div>
  <script src="harness.js"></script>
</body>
</html>
